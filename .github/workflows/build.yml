name: build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: TreeChopperMod
          path: bin/Release/net10.0/TreeChopperMod.dll
          
